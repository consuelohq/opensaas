name = "consuelo-os-device-authority"
main = "src/worker.ts"
compatibility_date = "2026-06-11"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "os.consuelohq.com/*", zone_name = "consuelohq.com" }
]

[vars]
OS_DEVICE_AUTH_ORIGIN = "https://os.consuelohq.com"
OS_DEVICE_AUTH_DEFAULT_SITE_SNAPSHOT_KEY = "sites/workspace_testing/launcher/sha256-15c3f6f5c611b43c/index.html"
OS_DEVICE_AUTH_DEFAULT_SITE_SNAPSHOT_VERSION_ID = "sha256-15c3f6f5c611b43c"
CLOUDFLARE_ACCOUNT_ID = "90b2b9dfeefcad97b9e2325b2b2e7a96"
CLOUDFLARE_ZONE_ID = "3787f63d39977227bc1cb346e0d67dc9"
OS_DEVICE_AUTH_BASE_DOMAIN = "consuelohq.com"
OS_DEVICE_AUTH_WORKSPACE_EDGE_HOSTNAME = "workspace-edge.consuelohq.com"
OS_DEVICE_AUTH_CONNECTOR_LOCAL_SERVICE_URL = "http://127.0.0.1:46321"

[secrets]
required = ["CLOUDFLARE_API_TOKEN"]

[[d1_databases]]
binding = "WORKSPACE_ROUTE_REGISTRY"
database_name = "consuelo-workspace-route-registry"
database_id = "2e16a374-cf0d-463e-b696-b24b8c8599bd"
migrations_dir = "../workspace-edge/migrations"

[[durable_objects.bindings]]
name = "DEVICE_GRANTS"
class_name = "OsDeviceGrantDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OsDeviceGrantDurableObject"]
