<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traces - Observability</title>
  <meta name="description" content="Live Consuelo workspace traces." />
  <style>
    :root {
      --bg: #050403;
      --panel: #11100d;
      --panel-2: #171510;
      --line: rgba(243, 234, 211, 0.14);
      --line-soft: rgba(243, 234, 211, 0.09);
      --text: #ece3cf;
      --muted: #9f9580;
      --amber: #d0ad61;
      --green: #a5b987;
      --red: #df7555;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    .trace-shell {
      width: 100vw;
      height: 100dvh;
      min-height: 520px;
      display: grid;
      grid-template-rows: 48px 64px minmax(0, 1fr) 44px;
      background: var(--bg);
      overflow: hidden;
    }
    .trace-chrome {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr) 92px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #13110e;
      padding: 0 14px;
    }
    .trace-dots { display: flex; gap: 8px; align-items: center; }
    .trace-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .trace-dots span:nth-child(2) { background: var(--amber); }
    .trace-dots span:nth-child(3) { background: #75ae70; }
    .trace-title { text-align: center; color: #b7ad98; letter-spacing: .04em; }
    .trace-state { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .trace-state[data-state="live"] { color: var(--green); }
    .trace-state[data-state="stale"] { color: var(--amber); }
    .trace-toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 150px;
      gap: 12px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: #0b0a08;
    }
    .trace-search, .trace-window {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid rgba(243, 234, 211, .26);
      border-radius: 12px;
      background: #13110e;
      outline: none;
    }
    .trace-search { padding: 0 16px; }
    .trace-search::placeholder { color: #a59b88; }
    .trace-search:focus, .trace-window:focus { border-color: rgba(208, 173, 97, .72); }
    .trace-window { padding: 0 14px; color: var(--text); }
    .trace-table-pane { min-height: 0; min-width: 0; overflow: auto; scrollbar-color: #595246 #0b0a08; }
    .trace-table { min-width: 1570px; }
    .trace-head, .trace-row {
      display: grid;
      grid-template-columns: 42px 102px 170px 92px 92px 254px 280px 280px 164px 104px 90px;
      align-items: center;
    }
    .trace-head {
      position: sticky;
      top: 0;
      z-index: 3;
      height: 50px;
      color: #b7ad98;
      background: #13110e;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .trace-head span, .trace-row > span {
      min-width: 0;
      padding: 0 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .trace-row {
      min-height: 48px;
      border-bottom: 1px solid var(--line-soft);
      background: #050403;
      font-variant-numeric: tabular-nums;
    }
    .trace-row:nth-child(even) { background: #070604; }
    .trace-row:hover { background: rgba(208, 173, 97, .065); }
    .trace-check {
      width: 18px;
      height: 18px;
      margin-left: 14px;
      border: 1px solid rgba(243, 234, 211, .35);
      border-radius: 5px;
      padding: 0 !important;
    }
    .trace-tool { color: var(--text); font-weight: 650; }
    .trace-branch { color: #c06c9e; font-weight: 650; }
    .trace-status.success { color: var(--green); }
    .trace-status.error { color: var(--red); }
    .trace-output, .trace-input, .trace-id { color: #b3aa97; }
    .trace-empty { padding: 30px 66px; color: var(--muted); }
    .trace-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-top: 1px solid var(--line);
      background: #13110e;
      color: var(--muted);
      font-size: 12px;
      overflow-x: auto;
      white-space: nowrap;
    }
    .trace-footer b { color: #c9bfaa; }
    .trace-footer input {
      width: 56px;
      height: 30px;
      border: 1px solid rgba(243, 234, 211, .23);
      border-radius: 9px;
      background: #181611;
      text-align: center;
    }
    .trace-footer button {
      width: 32px;
      height: 30px;
      border: 1px solid rgba(243, 234, 211, .23);
      border-radius: 9px;
      background: #181611;
    }
    .trace-footer button:disabled { opacity: .35; cursor: default; }
    @media (max-width: 760px) {
      .trace-shell { grid-template-rows: 0 84px minmax(0, 1fr) 46px; min-height: 100dvh; }
      .trace-chrome { visibility: hidden; overflow: hidden; border: 0; }
      .trace-toolbar { grid-template-columns: minmax(0, 1fr) 124px; gap: 8px; padding: 12px 18px; }
      .trace-search, .trace-window { height: 52px; border-radius: 13px; font-size: 18px; }
      .trace-head, .trace-row { grid-template-columns: 42px 106px 178px 92px 96px 260px 280px 280px 164px 104px 90px; }
      .trace-head { height: 52px; }
      .trace-row { min-height: 54px; font-size: 16px; }
      .trace-footer { padding: 0 16px; gap: 14px; }
    }
  </style>
</head>
<body>
  <main class="trace-shell" data-trace-app data-feed-url="/gateway/traces/recent" data-events-url="/gateway/traces/events">
    <header class="trace-chrome">
      <div class="trace-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="trace-title">Traces</div>
      <div class="trace-state" data-live-state data-state="loading">loading</div>
    </header>
    <div class="trace-toolbar">
      <input class="trace-search" data-search placeholder="Search traces..." aria-label="Search traces" autocomplete="off" />
      <select class="trace-window" data-window aria-label="Trace time window"><option value="1d">1 day</option></select>
    </div>
    <section class="trace-table-pane" aria-label="Trace table">
      <div class="trace-table">
        <div class="trace-head"><span></span><span>Time</span><span>Tool</span><span>Latency</span><span>Tokens</span><span>Branch</span><span>Input</span><span>Output</span><span>Trace</span><span>Status</span><span>Cost</span></div>
        <div data-trace-rows><div class="trace-empty">Loading traces...</div></div>
      </div>
    </section>
    <footer class="trace-footer">
      <span><b data-trace-count>0</b> traces</span>
      <span>Rows per page <b>100</b></span>
      <span>Page <input data-page-input value="1" inputmode="numeric" aria-label="Page" /> of <b data-page-count>1</b></span>
      <button type="button" data-prev-page aria-label="Previous page">\u2039</button>
      <button type="button" data-next-page aria-label="Next page">\u203A</button>
      <span data-footer-state>loading</span>
    </footer>
  </main>
  <script>
    (function mountTraceTable() {
      const root = document.querySelector('[data-trace-app]');
      if (!root) return;
      const feedUrl = root.dataset.feedUrl || '/gateway/traces/recent';
      const eventsUrl = root.dataset.eventsUrl || '/gateway/traces/events';
      const pageSize = 100;
      const maxBacklogPages = 3;
      let state = { rows: [], query: '', page: 1, liveCursor: '', liveState: 'loading', loadError: '' };
      let source = null;
      let hydrateTimer = null;

      const first = function () {
        for (let i = 0; i < arguments.length; i += 1) {
          const value = arguments[i];
          if (value !== undefined && value !== null && String(value).length > 0) return value;
        }
        return '';
      };
      const escapeHtml = (value) => String(value == null ? '' : value).replace(/[&<>\"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[char] || char);
      const safeSummary = (value) => {
        if (value === null || value === undefined) return '';
        if (typeof value === 'string') return value;
        if (typeof value !== 'object') return String(value);
        return String(first(value.summary, value.message, value.command, value.path, value.code, ''));
      };
      const compact = (value) => {
        const n = Number(value || 0);
        if (!Number.isFinite(n)) return '0';
        if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        return String(Math.round(n));
      };
      const latency = (row) => {
        const ms = Number(first(row.durationMs, row.duration_ms, ''));
        if (Number.isFinite(ms) && ms >= 0) return (ms / 1000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + 's';
        const raw = String(first(row.latency, row.duration, '\u2014'));
        const match = raw.match(/^(\d+(?:\.\d+)?)ms$/);
        if (match) return (Number(match[1]) / 1000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + 's';
        return raw;
      };
      const timeOnly = (value) => {
        const raw = String(value || '');
        const matched = raw.match(/(?:T|\s)(\d{2}:\d{2}:\d{2})(?:\.\d+)?/);
        if (matched) return matched[1];
        if (/^\d{2}:\d{2}:\d{2}/.test(raw)) return raw.slice(0, 8);
        const date = new Date(raw);
        return Number.isNaN(date.getTime()) ? '\u2014' : date.toISOString().slice(11, 19);
      };
      const stableTraceKey = (row) => String(first(row && row.traceId, row && row.trace, row && row.recordId, row && row.idempotencyKey, row && row.id, row && row.metadata && row.metadata.rowid, ''));
      const normalize = (row) => {
        const input = safeSummary(first(row.input, row.inputSummary, row.request, row.args, ''));
        const output = safeSummary(first(row.output, row.outputSummary, row.result, row.response, row.errorCause, row.summary, ''));
        const inputTokens = Number(first(row.inputTokens, row.input_tokens, 0) || 0);
        const outputTokens = Number(first(row.outputTokens, row.output_tokens, 0) || 0);
        const tokens = Number(first(row.tokens, row.totalTokens, row.total_tokens, inputTokens + outputTokens, 0) || 0);
        const cost = Number(first(row.cost, row.costUsd, row.totalCostUsd, 0) || 0);
        const rawStatus = String(first(row.status, row.success === false ? 'error' : 'success'));
        const success = row.success === true || row.ok === true || rawStatus === 'ok' || rawStatus === 'success';
        return Object.assign({}, row, {
          branch: String(first(row.branch, row.gitBranch, row.taskSession, 'no-branch')),
          toolName: String(first(row.toolName, row.name, row.traceName, row.tool, 'unknown')),
          input,
          output,
          tokens,
          cost,
          latencyLabel: latency(row),
          timeLabel: timeOnly(first(row.time, row.startTime, row.startedAt, row.started_at, row.timestamp, row.createdAt, '')),
          statusLabel: success ? 'success' : 'error'
        });
      };
      const mergeRows = (incoming, existing) => {
        const seen = new Set();
        const merged = [];
        incoming.concat(existing).forEach((candidate) => {
          const row = normalize(candidate);
          const key = stableTraceKey(row);
          if (!key || seen.has(key)) return;
          seen.add(key);
          merged.push(row);
        });
        return merged.slice(0, pageSize * maxBacklogPages);
      };
      const setLiveState = (value) => {
        state.liveState = value;
        const top = root.querySelector('[data-live-state]');
        if (top) { top.textContent = value; top.dataset.state = value; }
        const footer = root.querySelector('[data-footer-state]');
        if (footer) footer.textContent = value;
      };
      const filteredRows = () => {
        const q = state.query.trim().toLowerCase();
        if (!q) return state.rows;
        return state.rows.filter((row) => [row.timeLabel, row.toolName, row.latencyLabel, row.tokens, row.branch, row.input, row.output, stableTraceKey(row), row.statusLabel, row.cost].join(' ').toLowerCase().includes(q));
      };
      const render = () => {
        const rowsHost = root.querySelector('[data-trace-rows]');
        const filtered = filteredRows();
        const pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
        state.page = Math.max(1, Math.min(state.page, pageCount));
        const visible = filtered.slice((state.page - 1) * pageSize, state.page * pageSize);
        if (rowsHost) {
          if (visible.length) {
            rowsHost.innerHTML = visible.map((row) => {
              const status = row.statusLabel === 'error' ? 'error' : 'success';
              const statusGlyph = status === 'error' ? '\u2724' : '\u2724';
              return '<div class="trace-row">' +
                '<span class="trace-check" aria-hidden="true"></span>' +
                '<span>' + escapeHtml(row.timeLabel) + '</span>' +
                '<span class="trace-tool"><span class="trace-status ' + status + '">' + statusGlyph + '</span> ' + escapeHtml(row.toolName) + '</span>' +
                '<span>' + escapeHtml(row.latencyLabel) + '</span>' +
                '<span>' + escapeHtml(compact(row.tokens)) + '</span>' +
                '<span class="trace-branch">' + escapeHtml(row.branch) + '</span>' +
                '<span class="trace-input" title="' + escapeHtml(row.input) + '">' + escapeHtml(row.input) + '</span>' +
                '<span class="trace-output" title="' + escapeHtml(row.output) + '">' + escapeHtml(row.output) + '</span>' +
                '<span class="trace-id">' + escapeHtml(stableTraceKey(row)) + '</span>' +
                '<span class="trace-status ' + status + '">' + status + '</span>' +
                '<span>$' + Number(row.cost || 0).toFixed(4) + '</span>' +
              '</div>';
            }).join('');
          } else {
            const message = state.loadError || (state.query ? 'No traces match this search.' : 'No traces found in this view.');
            rowsHost.innerHTML = '<div class="trace-empty">' + escapeHtml(message) + '</div>';
          }
        }
        const count = root.querySelector('[data-trace-count]');
        if (count) count.textContent = String(filtered.length);
        const pageInput = root.querySelector('[data-page-input]');
        if (pageInput) pageInput.value = String(state.page);
        const pageTotal = root.querySelector('[data-page-count]');
        if (pageTotal) pageTotal.textContent = String(pageCount);
        const prev = root.querySelector('[data-prev-page]');
        if (prev) prev.disabled = state.page <= 1;
        const next = root.querySelector('[data-next-page]');
        if (next) next.disabled = state.page >= pageCount;
      };
      const fetchJson = async (url) => {
        const response = await fetch(url, { headers: { Accept: 'application/json' }, credentials: 'same-origin', cache: 'no-store' });
        if (!response.ok) {
          const error = new Error('trace request failed');
          error.status = response.status;
          throw error;
        }
        return response.json();
      };
      const historyPage = async (cursor) => {
        const params = new URLSearchParams({ direction: 'older', cursor: cursor || 'latest', limit: String(pageSize), includeRawPayload: 'true' });
        const payload = await fetchJson(feedUrl + '?' + params.toString());
        const data = payload && payload.data ? payload.data : {};
        return { rows: Array.isArray(data.rows) ? data.rows : [], nextCursor: data.nextCursor || null };
      };
      const newestRowCursor = (rows) => {
        const row = rows[0];
        const rowid = row && row.metadata && Number(row.metadata.rowid);
        return Number.isFinite(rowid) && rowid > 0 ? String(Math.floor(rowid)) : '';
      };
      const loadBacklog = async () => {
        let cursor = 'latest';
        let backlog = [];
        for (let page = 0; page < maxBacklogPages; page += 1) {
          const result = await historyPage(cursor);
          backlog = backlog.concat(result.rows);
          if (!result.nextCursor || result.rows.length === 0) break;
          cursor = result.nextCursor;
        }
        state.rows = mergeRows(backlog, []);
        state.liveCursor = newestRowCursor(state.rows);
        state.loadError = '';
        setLiveState('live');
        render();
      };
      const refreshNewest = async () => {
        try {
          const result = await historyPage('latest');
          state.rows = mergeRows(result.rows, state.rows);
          state.liveCursor = newestRowCursor(state.rows) || state.liveCursor;
          state.loadError = '';
          setLiveState('live');
          render();
        } catch (_) {
          if (state.rows.length) setLiveState('stale');
        }
      };
      const queueHydrate = () => {
        if (hydrateTimer) window.clearTimeout(hydrateTimer);
        hydrateTimer = window.setTimeout(refreshNewest, 180);
      };
      const connectEvents = () => {
        if (!window.EventSource) {
          window.setInterval(refreshNewest, 10000);
          return;
        }
        const cursor = state.liveCursor || 'latest';
        source = new EventSource(eventsUrl + '?cursor=' + encodeURIComponent(cursor), { withCredentials: true });
        const handle = (event) => {
          let message = {};
          try { message = event.data ? JSON.parse(event.data) : {}; } catch (_) { setLiveState('stale'); return; }
          if (message.type === 'snapshot' && Array.isArray(message.traces) && message.traces.length) {
            state.rows = mergeRows(message.traces, state.rows);
            render();
            queueHydrate();
          }
          if (message.type === 'trace' && message.trace) {
            state.rows = mergeRows([message.trace], state.rows);
            render();
            queueHydrate();
          }
          if (message.cursor) state.liveCursor = String(message.cursor);
          if (message.type === 'keepalive' || message.type === 'trace' || message.type === 'snapshot') setLiveState('live');
        };
        source.addEventListener('snapshot', handle);
        source.addEventListener('trace', handle);
        source.addEventListener('keepalive', handle);
        source.addEventListener('state', handle);
        source.onerror = function () { if (state.rows.length) setLiveState('stale'); };
      };

      root.querySelector('[data-search]')?.addEventListener('input', (event) => {
        state.query = event.target.value || '';
        state.page = 1;
        render();
      });
      root.querySelector('[data-prev-page]')?.addEventListener('click', () => { state.page = Math.max(1, state.page - 1); render(); });
      root.querySelector('[data-next-page]')?.addEventListener('click', () => { state.page += 1; render(); });
      root.querySelector('[data-page-input]')?.addEventListener('change', (event) => {
        const page = Math.max(1, Math.floor(Number(event.target.value) || 1));
        state.page = page;
        render();
      });

      render();
      loadBacklog().then(connectEvents).catch((error) => {
        const status = Number(error && error.status);
        state.loadError = status === 401
          ? 'Sign in to this workspace to load traces.'
          : status === 403
            ? 'This workspace session cannot read traces.'
            : 'Trace data unavailable.';
        setLiveState(status === 401 || status === 403 ? 'signed out' : 'stale');
        render();
      });
    })();
  </script>
</body>
</html>
