name: Consuelo CI Setup
description: Set up the Bun-owned Consuelo CI toolchain.

inputs:
  bun-version:
    description: Bun version used by Consuelo CI.
    required: false
    default: '1.3.14'
  node-version:
    description: Node version used by Consuelo CI jobs that still need Node.
    required: false
    default: '24'
  setup-node:
    description: Set up Node for jobs that still execute Node-based tooling.
    required: false
    default: 'true'
  install-root:
    description: Install the root workspace dependency graph.
    required: false
    default: 'true'
  install-workspace:
    description: Install the independent packages/workspace Bun dependency graph.
    required: false
    default: 'false'
  install-os:
    description: Install the packages/os Bun dependency graph.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Node
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install repository dependencies
      if: ${{ inputs.install-root == 'true' }}
      uses: ./.github/actions/bun-install

    - name: Install workspace toolchain dependencies
      if: ${{ inputs.install-workspace == 'true' }}
      shell: bash
      working-directory: packages/workspace
      run: bun install --frozen-lockfile

    - name: Install OS dependencies
      if: ${{ inputs.install-os == 'true' }}
      shell: bash
      working-directory: packages/os
      run: bun install --frozen-lockfile
