name: Legacy Twenty / Shared

on:
  pull_request:
    paths:
      - 'packages/twenty-shared/**'
      - '.github/workflows/ci-shared.yaml'
      - 'packages/workspace/scripts/ci/lint-changed-frontend-files.mjs'
      - 'packages/workspace/scripts/ci/run-changed-frontend-task.mjs'
      - 'packages/workspace/tests/lint-changed-frontend-files.test.mjs'
      - 'packages/workspace/tests/run-changed-frontend-task.test.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-shared/**
  shared-test:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, typecheck, test]
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Resolve shared task comparison SHAs
        uses: nrwl/nx-set-shas@v4
      - name: Lint changed frontend files
        if: matrix.task == 'lint'
        run: node packages/workspace/scripts/ci/lint-changed-frontend-files.mjs
      - name: Run changed frontend ${{ matrix.task }} task
        if: matrix.task != 'lint'
        run: node packages/workspace/scripts/ci/run-changed-frontend-task.mjs --task ${{ matrix.task }}
  ci-shared-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, shared-test]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
