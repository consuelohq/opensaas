name: Consuelo OS Distribution Environments

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/consuelo-os-distribution-environments.yaml
      - packages/os/package.json
      - packages/os/bun.lock
      - packages/os/cloudflare/**
      - packages/os/docs/**
      - packages/os/native/**
      - packages/os/scripts/**
      - packages/os/tests/**
  push:
    branches:
      - main
      - stream/os-distribution
      - stream/os-native
    paths:
      - .github/workflows/consuelo-os-distribution-environments.yaml
      - packages/os/package.json
      - packages/os/bun.lock
      - packages/os/cloudflare/**
      - packages/os/docs/**
      - packages/os/native/**
      - packages/os/scripts/**
      - packages/os/tests/**
  workflow_dispatch:

concurrency:
  group: consuelo-os-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oci-clean-host:
    name: Consuelo OS / clean OCI host
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the pinned clean-host probe
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            docker.io/oven/bun:1.3.14 \
            bun packages/os/scripts/testing/distribution/environment-probe.ts --json \
            > packages/os/distribution-environment.json

      - name: Upload the clean-host report
        uses: actions/upload-artifact@v4
        with:
          name: consuelo-os-distribution-oci-${{ github.run_id }}
          path: packages/os/distribution-environment.json

  native-runtime:
    name: Consuelo OS / native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: macos
            runner: macos-26
          - name: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install OS dependencies
        working-directory: packages/os
        run: bun install --frozen-lockfile

      - name: Run macOS menu-bar contracts
        if: matrix.name == 'macos'
        run: swift run --package-path packages/os/native/macos ConsueloMacContractTests

      - name: Run native lifecycle TypeScript contracts
        if: matrix.name == 'macos'
        working-directory: packages/os
        run: >-
          bun x vitest run
          tests/native-lifecycle-client.test.ts
          tests/native-lifecycle-endpoint.test.ts
          tests/native-lifecycle-operation.test.ts

      - name: Package the macOS alpha app
        if: matrix.name == 'macos'
        run: bash packages/os/scripts/testing/macos-alpha-package.sh packages/os/.tmp-macos-alpha

      - name: Record the macOS alpha app checksum
        if: matrix.name == 'macos'
        id: macos-alpha-checksum
        shell: bash
        run: >-
          echo "digest=$(shasum -a 256 packages/os/.tmp-macos-alpha/Consuelo.app.tar.gz | awk '{print $1}')"
          >> "$GITHUB_OUTPUT"

      - name: Upload the macOS alpha app
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: consuelo-macos-alpha-${{ github.run_id }}
          path: packages/os/.tmp-macos-alpha/Consuelo.app.tar.gz
          if-no-files-found: error

      - name: Download the uploaded macOS alpha app
        if: matrix.name == 'macos'
        uses: actions/download-artifact@v4
        with:
          name: consuelo-macos-alpha-${{ github.run_id }}
          path: packages/os/.tmp-macos-alpha-verify

      - name: Verify the uploaded macOS alpha app
        if: matrix.name == 'macos'
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.macos-alpha-checksum.outputs.digest }}
        run: |
          actual_digest="$(shasum -a 256 packages/os/.tmp-macos-alpha-verify/Consuelo.app.tar.gz | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_DIGEST"

      - name: Run Windows platform contracts
        if: matrix.name == 'windows'
        working-directory: packages/os
        run: bun x vitest run tests/windows-platform.test.ts tests/windows-bootstrap-source.test.ts

      - name: Build the Windows service host
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "Visual Studio installer discovery is unavailable: $vswhere"
          }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw 'MSBuild was not found through Visual Studio installer discovery.'
          }
          & $msbuild packages/os/native/windows-service/Consuelo.Windows.Service.csproj /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild exited with code $LASTEXITCODE."
          }

      - name: Run native Windows platform acceptance
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: packages/os
        run: ./scripts/testing/windows-platform-acceptance.ps1

      - name: Remove Windows service build intermediates
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath packages/os/native/windows-service/bin -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath packages/os/native/windows-service/obj -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run portable distribution contracts
        if: matrix.name != 'macos'
        working-directory: packages/os
        run: bun x vitest run tests/distribution --testTimeout 15000

      - name: Run complete distribution rehearsal
        if: matrix.name == 'macos'
        working-directory: packages/os
        run: bun run test:distribution:integration

      - name: Probe the native runner
        working-directory: packages/os
        run: >-
          bun scripts/testing/distribution/environment-probe.ts
          --json
          --output distribution-environment.json

      - name: Upload the native runner report
        uses: actions/upload-artifact@v4
        with:
          name: consuelo-os-distribution-${{ matrix.name }}-${{ github.run_id }}
          path: packages/os/distribution-environment.json

  debian-linux-platform:
    name: Consuelo OS / Debian 12 Linux platform
    runs-on: ubuntu-24.04
    container: debian:12-slim
    timeout-minutes: 15
    steps:
      - name: Install runner prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git unzip && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install OS dependencies
        working-directory: packages/os
        run: bun install --frozen-lockfile

      - name: Run Linux platform contracts
        working-directory: packages/os
        run: bun x vitest run tests/linux-platform.test.ts

  regression-contracts:
    name: Consuelo OS / existing distribution regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install OS dependencies
        working-directory: packages/os
        run: bun install --frozen-lockfile

      - name: Run existing installer, steering, and gateway contracts
        working-directory: packages/os
        run: >-
          bun x vitest run
          tests/bootstrap-source.test.ts
          tests/install-state.test.ts
          tests/os-get-steering-trace.test.ts
          tests/os-raw-steering.test.ts
          tests/mcp-gateway.test.ts
          tests/security-gateway.test.ts
          tests/workspace-gateway-contract.test.ts
