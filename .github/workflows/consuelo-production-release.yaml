name: Consuelo Production Release

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Production surface to release.
        required: true
        default: all
        type: choice
        options:
          - all
          - docs
          - website
          - os
          - os-device-auth
          - dialer
      dialer_worker_only:
        description: Deploy only the LeadConnector Worker on existing routes; do not restart Railway.
        required: false
        default: false
        type: boolean
      migrate_mcp_origin_waf:
        description: Migrate the managed OS MCP rules to the canonical connector-origin hostname class.
        required: false
        default: false
        type: boolean
      reconcile_mcp_ingress_policy:
        description: Reconcile the managed OS/workspace MCP source-IP rules with the current security policy.
        required: false
        default: false
        type: boolean

concurrency:
  group: consuelo-production-release
  cancel-in-progress: false

jobs:
  dialer-changes:
    name: Consuelo / dialer release changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.classify.outputs.release }}
      frontend_only: ${{ steps.classify.outputs.frontend_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify dialer release changes
        id: classify
        shell: bash
        env:
          CONSUELO_DIALER_WORKER_ONLY: ${{ inputs.dialer_worker_only || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${CONSUELO_DIALER_WORKER_ONLY:-false}" == "true" ]]; then
              if [[ "${{ inputs.target }}" != "dialer" ]]; then
                echo "::error::Worker-only release requires target=dialer"
                exit 1
              fi
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "frontend_only=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "${{ inputs.target }}" in
              all|dialer) echo "release=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "frontend_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$before" "$GITHUB_SHA" > "$RUNNER_TEMP/dialer-release-changes.txt"
          cat "$RUNNER_TEMP/dialer-release-changes.txt"
          # Releasing a QA catalog or disposable lab fix is not permission to
          # restart Railway or replace the live Calls Worker. Only exempt this
          # known set when *every* changed file is QA/metadata. Any other
          # package or runtime change must take the normal release path.
          qa_only=true
          qa_file_seen=false
          qa_package_safe=true
          while IFS= read -r path; do
            case "$path" in
              packages/dialer-server/package.json)
                qa_file_seen=true
                # The only permitted package change is the lab:launch script.
                # Dependency, entrypoint and all other script edits still deploy.
                if ! before_package="$(git show "$before:$path" | jq -S 'del(.scripts["lab:launch"])')" ||
                   ! after_package="$(git show "$GITHUB_SHA:$path" | jq -S 'del(.scripts["lab:launch"])')"; then
                  qa_only=false
                  qa_package_safe=false
                elif [[ "$before_package" != "$after_package" ]]; then
                  qa_only=false
                  qa_package_safe=false
                fi
                ;;
              packages/dialer-server/LAUNCH-QA.md|\
              packages/dialer-server/scripts/launch-scenarios.ts|\
              packages/dialer-server/scripts/local-dialer-lab.ts|\
              packages/dialer-server/src/lab/launch-scenarios.ts|\
              packages/dialer-server/src/lab/launch-scenarios.test.ts|\
              packages/dialer-server/src/lab/launch-scenarios.cli.test.ts|\
              packages/dialer-server/src/lab/launch-release-classifier.test.ts|\
              packages/dialer-server/src/lab/learning-rollback-scenario.ts|\
              packages/dialer-server/src/lab/bounded-qa-process.ts|packages/dialer-server/src/lab/bounded-qa-process.test.ts|packages/dialer-server/src/lab/launch-component-cli.test.ts|packages/dialer-server/src/lab/rep-campaign.ts|\
              packages/dialer-server/src/lab/rep-campaign-plan.ts|\
              packages/dialer-server/src/lab/rep-campaign.test.ts|\
              packages/dialer-server/src/lab/qa-postgres-suites.ts|\
              packages/dialer-server/src/lab/historical-inbound-fixture.ts|\
              packages/dialer-server/src/lab/local-dialer-lab.integration.test.ts|\
              packages/dialer-server/src/inbound/rep-capacity.integration.test.ts|\
              packages/dialer-server/src/inbound/routing.integration.test.ts|\
              packages/dialer-server/src/inbound/callbacks.integration.test.ts|\
              packages/dialer-server/src/inbound/telephony.integration.test.ts)
                qa_file_seen=true
                ;;
              .task/*|.github/workflows/consuelo-production-release.yaml)
                ;;
              *)
                qa_only=false
                ;;
            esac
          done < "$RUNNER_TEMP/dialer-release-changes.txt"
          if [[ "$qa_only" == true && "$qa_file_seen" == true ]]; then
            echo "Dialer launch QA-only change; preserving live Railway and Worker."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "frontend_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # DEV-1676 changes only the embedded presentation. Deploy the
          # Calls Worker alone; do not restart Railway or change phone state.
          # Mixed code, dependency or backend changes use the normal release.
          ui_only=true
          ui_file_seen=false
          while IFS= read -r path; do
            case "$path" in
              packages/lead-connector/src/embed/calling-workspace.test.ts|\
              packages/lead-connector/src/embed/compact-workspace-polish.test.ts|\
              packages/lead-connector/src/embed/inbound-operator-view.ts|\
              packages/lead-connector/src/embed/internal-main.ts|\
              packages/lead-connector/src/embed/view.ts|\
              packages/lead-connector/src/embed/workspace-pages.ts|\
              packages/lead-connector/src/embed/workspace-theme.css|\
              packages/lead-connector/src/deployment/release-workflow.contract.test.ts)
                ui_file_seen=true
                ;;
              packages/dialer-server/package.json)
                # Already validated in the QA classifier. Only the addition
                # of the lab:launch script can be neutral to a UI-only push.
                if [[ "$qa_package_safe" != true ]]; then
                  ui_only=false
                fi
                ;;
              packages/dialer-server/LAUNCH-QA.md|\
              packages/dialer-server/scripts/launch-scenarios.ts|\
              packages/dialer-server/scripts/local-dialer-lab.ts|\
              packages/dialer-server/src/lab/launch-scenarios.ts|\
              packages/dialer-server/src/lab/launch-scenarios.test.ts|\
              packages/dialer-server/src/lab/launch-scenarios.cli.test.ts|\
              packages/dialer-server/src/lab/launch-release-classifier.test.ts|\
              packages/dialer-server/src/lab/learning-rollback-scenario.ts|\
              packages/dialer-server/src/lab/bounded-qa-process.ts|packages/dialer-server/src/lab/bounded-qa-process.test.ts|packages/dialer-server/src/lab/launch-component-cli.test.ts|packages/dialer-server/src/lab/rep-campaign.ts|\
              packages/dialer-server/src/lab/rep-campaign-plan.ts|\
              packages/dialer-server/src/lab/rep-campaign.test.ts|\
              packages/dialer-server/src/lab/qa-postgres-suites.ts|\
              packages/dialer-server/src/lab/historical-inbound-fixture.ts|\
              packages/dialer-server/src/lab/local-dialer-lab.integration.test.ts|\
              packages/dialer-server/src/inbound/rep-capacity.integration.test.ts|\
              packages/dialer-server/src/inbound/routing.integration.test.ts|\
              packages/dialer-server/src/inbound/callbacks.integration.test.ts|\
              packages/dialer-server/src/inbound/telephony.integration.test.ts)
                # QA catalog/files do not change live telephony behavior.
                ;;
              .task/*|.github/workflows/consuelo-production-release.yaml)
                ;;
              *)
                ui_only=false
                ;;
            esac
          done < "$RUNNER_TEMP/dialer-release-changes.txt"
          if [[ "$ui_only" == true && "$ui_file_seen" == true ]]; then
            echo "Scoped DEV-1676 UI-only change: Cloudflare, not Railway."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "frontend_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "frontend_only=false" >> "$GITHUB_OUTPUT"
          # CI and release-orchestration edits are not dialer runtime changes.
          # Releasing them needlessly redeploys the live dialer; preserve runtime,
          # root dependency, and explicit rollback triggers.
          if grep -Eq '^(packages/(dialer|dialer-server|lead-connector|logger|contacts|conversation)/|\.github/workflows/consuelo-dialer-rollback\.yaml$|package\.json$|bun\.lock$|bunfig\.toml$|\.bun-version$|nx\.json$|tsconfig[^/]*\.json$)' "$RUNNER_TEMP/dialer-release-changes.txt"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  public-changes:
    name: Consuelo / public and OS release changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      website: ${{ steps.classify.outputs.website }}
      os: ${{ steps.classify.outputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun for release classification
        uses: oven-sh/setup-bun@v2

      - name: Classify public and OS release changes
        id: classify
        run: bun packages/os/scripts/production-release-plan.ts
        env:
          CONSUELO_RELEASE_EVENT: ${{ github.event_name }}
          CONSUELO_RELEASE_TARGET: ${{ inputs.target }}
          CONSUELO_RELEASE_BEFORE: ${{ github.event.before }}
          CONSUELO_RELEASE_HEAD: ${{ github.sha }}
          CONSUELO_PUBLIC_SITE_PHASE: ${{ vars.CONSUELO_PUBLIC_SITE_PHASE || 'legacy' }}

  deploy-docs:
    name: Consuelo / docs deploy
    needs: public-changes
    if: needs.public-changes.outputs.docs == 'true'
    environment: consuelo / production
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy public documentation for the active phase
        run: bun packages/dialer-website/scripts/release-public-sites.mjs --surface docs --deploy
        env:
          CONSUELO_PUBLIC_SITE_PHASE: ${{ vars.CONSUELO_PUBLIC_SITE_PHASE || 'legacy' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN || secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}

  deploy-website:
    name: Consuelo / website deploy
    needs: public-changes
    if: needs.public-changes.outputs.website == 'true'
    environment: consuelo / production
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy public websites for the active phase
        run: bun packages/dialer-website/scripts/release-public-sites.mjs --surface website --deploy
        env:
          CONSUELO_PUBLIC_SITE_PHASE: ${{ vars.CONSUELO_PUBLIC_SITE_PHASE || 'legacy' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN || secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}

  release-os:
    name: Consuelo / OS release
    needs: [public-changes, deploy-docs, deploy-website]
    if: >-
      always() &&
      needs.public-changes.outputs.os == 'true' &&
      (needs.deploy-docs.result == 'success' || needs.deploy-docs.result == 'skipped') &&
      (needs.deploy-website.result == 'success' || needs.deploy-website.result == 'skipped')
    environment: consuelo / production
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install OS dependencies
        run: bun install --frozen-lockfile
        working-directory: packages/os

      - name: Install Wrangler
        run: bun install --global wrangler@4.105.0

      - name: Release Consuelo OS
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_OS_RELEASE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CONSUELO_OS_RELEASE_R2_BUCKET:-}" ]; then
            echo "::error::Missing GitHub Actions variable CONSUELO_OS_RELEASE_R2_BUCKET"
            exit 1
          fi
          if [ -z "${CONSUELO_OS_RELEASE_TRUSTED_PUBLIC_KEYS:-}" ] &&
             { [ -z "${CONSUELO_OS_RELEASE_SIGNING_KEY_ID:-}" ] ||
               [ -z "${CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY:-}" ]; }; then
            echo "::error::Missing OS release trust anchors (CONSUELO_OS_RELEASE_TRUSTED_PUBLIC_KEYS or signing key id + public key)"
            exit 1
          fi
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.target }}" != "os-device-auth" ]]; then
            if [ -z "${CLOUDFLARE_WORKSPACE_EDGE_API_TOKEN:-}" ]; then
              echo "::error::Missing GitHub Actions secret CLOUDFLARE_WORKSPACE_EDGE_API_TOKEN"
              exit 1
            fi
            CLOUDFLARE_API_TOKEN="${CLOUDFLARE_WORKSPACE_EDGE_API_TOKEN}" \
              wrangler d1 execute consuelo-workspace-route-registry \
                --remote \
                --config packages/os/cloudflare/workspace-edge/wrangler.toml \
                --command "SELECT 1 AS ok" >/dev/null
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.target }}" == "os-device-auth" ]]; then
            bun run os:release -- --device-auth-only
          else
            bun run os:release
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CLOUDFLARE_WORKSPACE_EDGE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKSPACE_EDGE_API_TOKEN }}
          OS_MANAGED_CLOUD_PROVISIONER_SECRET: ${{ secrets.OS_MANAGED_CLOUD_PROVISIONER_SECRET }}
          CONSUELO_OS_RELEASE_R2_BUCKET: ${{ vars.CONSUELO_OS_RELEASE_R2_BUCKET }}
          CONSUELO_OS_RELEASE_SIGNING_KEY_ID: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_KEY_ID }}
          CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY }}
          CONSUELO_OS_RELEASE_TRUSTED_PUBLIC_KEYS: ${{ vars.CONSUELO_OS_RELEASE_TRUSTED_PUBLIC_KEYS }}

      - name: Sync Consuelo OS connector provisioning secret
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_OS_RELEASE_API_TOKEN"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_OS_PROVISIONING_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_OS_PROVISIONING_API_TOKEN"
            exit 1
          fi
          printf '%s' "${CLOUDFLARE_OS_PROVISIONING_API_TOKEN}" |
            wrangler secret put CLOUDFLARE_API_TOKEN --config packages/os/cloudflare/os-device-authority/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CLOUDFLARE_OS_PROVISIONING_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_PROVISIONING_API_TOKEN }}

      - name: Migrate managed OS MCP connector-origin WAF class
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_mcp_origin_waf
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_WAF_API_TOKEN"
            exit 1
          fi
          bun packages/os/scripts/migrate-managed-os-mcp-origin-class.ts --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 3787f63d39977227bc1cb346e0d67dc9
          OS_DEVICE_AUTH_BASE_DOMAIN: consuelohq.com

      - name: Reconcile managed OS MCP ingress policy
        if: github.event_name == 'workflow_dispatch' && inputs.reconcile_mcp_ingress_policy
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_WAF_API_TOKEN"
            exit 1
          fi
          bun packages/os/scripts/provision-managed-os-mcp-ingress-policy.ts --base-domain consuelohq.com --json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 3787f63d39977227bc1cb346e0d67dc9
          CLOUDFLARE_MCP_ALLOWED_IPS_LIST_NAME: mcp_allowed_ips
  release-dialer:
    name: Consuelo / dialer production release
    needs: dialer-changes
    if: needs.dialer-changes.outputs.release == 'true'
    environment: consuelo dialer / production
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Validate dialer release source
        run: |
          bun run --cwd packages/logger build
          bun run --cwd packages/contacts build
          bun run --cwd packages/conversation build
          bun test packages/dialer/src
          bun test packages/dialer-server/src
          bun test packages/lead-connector/src
          bun run --cwd packages/dialer typecheck
          bun run --cwd packages/dialer-server typecheck
          bun run --cwd packages/lead-connector typecheck
          bun run --cwd packages/dialer build
          bun run --cwd packages/lead-connector build
          bun run --cwd packages/dialer-server build

      - name: Validate dialer deployment configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_PROJECT_ID: ${{ vars.RAILWAY_DIALER_PROJECT_ID }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
          RAILWAY_DIALER_PUBLIC_ORIGIN: ${{ vars.RAILWAY_DIALER_PUBLIC_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
          DIALER_EDGE_PROXY_SECRET: ${{ secrets.DIALER_EDGE_PROXY_SECRET }}
          LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256: ${{ vars.LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256 }}
          LEADCONNECTOR_PRODUCTION_EMBED_URL: ${{ vars.LEADCONNECTOR_PRODUCTION_EMBED_URL }}
        run: |
          set -euo pipefail
          for name in \
            RAILWAY_TOKEN \
            RAILWAY_DIALER_PROJECT_ID \
            RAILWAY_DIALER_ENVIRONMENT_ID \
            RAILWAY_DIALER_SERVICE_ID \
            RAILWAY_DIALER_PUBLIC_ORIGIN \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            DIALER_EDGE_PROXY_SECRET \
            LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256 \
            LEADCONNECTOR_PRODUCTION_EMBED_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing dialer production deployment setting: ${name}"
              exit 1
            fi
          done
          if [[ "$(bun -e 'process.stdout.write(String((process.env.DIALER_EDGE_PROXY_SECRET ?? "").trim().length))')" -lt 24 ]]; then
            echo "::error::DIALER_EDGE_PROXY_SECRET must contain at least 24 characters after trimming"
            exit 1
          fi

      - name: Verify approved Marketplace bootstrap source
        env:
          LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256: ${{ vars.LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256 }}
        run: >-
          bun packages/lead-connector/scripts/verify-marketplace-bootstrap.ts
          packages/lead-connector/dist/embed-app/consuelo-lead-connector-click-to-call.marketplace-loader.html
          > "$RUNNER_TEMP/leadconnector-marketplace-bootstrap.json"

      - name: Configure dialer edge identity secret
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
          DIALER_EDGE_PROXY_SECRET: ${{ secrets.DIALER_EDGE_PROXY_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$DIALER_EDGE_PROXY_SECRET" |
            bunx @railway/cli@5.27.2 variables \
              --service "$RAILWAY_DIALER_SERVICE_ID" \
              --environment "$RAILWAY_DIALER_ENVIRONMENT_ID" \
              --set-from-stdin DIALER_EDGE_PROXY_SECRET \
              --skip-deploys
          printf '%s' "$DIALER_EDGE_PROXY_SECRET" |
            bunx wrangler@4.33.1 secret put DIALER_EDGE_PROXY_SECRET \
              --config packages/lead-connector/wrangler.jsonc

      - name: Snapshot Railway deployment
        id: railway-before
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
        run: |
          bun packages/dialer-server/scripts/railway-deployment.ts latest > "$RUNNER_TEMP/railway-before.json"
          deployment_id="$(jq -r '.id // "none"' "$RUNNER_TEMP/railway-before.json")"
          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"

      - name: Deploy dialer server to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_PROJECT_ID: ${{ vars.RAILWAY_DIALER_PROJECT_ID }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
        run: >-
          bunx @railway/cli@5.27.2 up
          --project "$RAILWAY_DIALER_PROJECT_ID"
          --environment "$RAILWAY_DIALER_ENVIRONMENT_ID"
          --service "$RAILWAY_DIALER_SERVICE_ID"
          --json

      - name: Wait for Railway deployment success
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
        run: >-
          bun packages/dialer-server/scripts/railway-deployment.ts wait
          "${{ steps.railway-before.outputs.deployment_id }}"
          > "$RUNNER_TEMP/railway-deployment.json"

      - name: Capture Railway failure logs
        if: failure()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DIALER_PROJECT_TOKEN }}
          RAILWAY_DIALER_ENVIRONMENT_ID: ${{ vars.RAILWAY_DIALER_ENVIRONMENT_ID }}
          RAILWAY_DIALER_SERVICE_ID: ${{ vars.RAILWAY_DIALER_SERVICE_ID }}
        run: >-
          bunx @railway/cli@5.27.2 logs
          --service "$RAILWAY_DIALER_SERVICE_ID"
          --environment "$RAILWAY_DIALER_ENVIRONMENT_ID"
          --latest --lines 200 --json

      - name: Run safe dialer production smoke
        env:
          DIALER_PRODUCTION_ORIGIN: ${{ vars.RAILWAY_DIALER_PUBLIC_ORIGIN }}
        run: >-
          bun packages/dialer-server/scripts/production-smoke.ts
          > "$RUNNER_TEMP/dialer-smoke.json"

      - name: Deploy LeadConnector worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          # A Worker update must not reconcile existing custom domains/routes.
          # The deployment token intentionally has Workers Scripts permission,
          # not the broader Zone Workers Routes edit permission.
          bunx wrangler@4.135.0 versions upload \
            --config packages/lead-connector/wrangler.jsonc \
            --keep-vars \
            --tag "dialer-$GITHUB_SHA" \
            --message "Dialer source $GITHUB_SHA"
          bunx wrangler@4.135.0 versions deploy \
            --config packages/lead-connector/wrangler.jsonc \
            --version-tag "dialer-$GITHUB_SHA" \
            --message "Dialer source $GITHUB_SHA" \
            --yes

      - name: Capture LeadConnector worker version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler@4.135.0 deployments list \
            --config packages/lead-connector/wrangler.jsonc \
            --json > "$RUNNER_TEMP/worker-deployments.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .[-1] |
            ((.annotations["workers/message"] // "") | contains($sha)) and
            ((.versions | length) == 1) and
            (.versions[0].percentage == 100) and
            ((.versions[0].version_id | type) == "string")
          ' "$RUNNER_TEMP/worker-deployments.json" > /dev/null
          version_id="$(jq -er '.[-1].versions[0].version_id' "$RUNNER_TEMP/worker-deployments.json")"
          jq -n \
            --arg workerName "consuelo-lead-connector-embed" \
            --arg versionId "$version_id" \
            '{workerName: $workerName, versionId: $versionId, targets: ["https://calls.consuelohq.com"]}' \
            > "$RUNNER_TEMP/cloudflare-deployment.json"

      - name: Verify LeadConnector worker
        env:
          LEADCONNECTOR_PRODUCTION_EMBED_URL: ${{ vars.LEADCONNECTOR_PRODUCTION_EMBED_URL }}
        run: >-
          bun packages/lead-connector/scripts/verify-production-edge.ts
          > "$RUNNER_TEMP/leadconnector-edge.json"

      - name: Write dialer release manifest
        run: >-
          bun packages/dialer-server/scripts/write-release-manifest.ts
          --railway "$RUNNER_TEMP/railway-deployment.json"
          --cloudflare "$RUNNER_TEMP/cloudflare-deployment.json"
          --edge "$RUNNER_TEMP/leadconnector-edge.json"
          --launcher-bootstrap "$RUNNER_TEMP/leadconnector-marketplace-bootstrap.json"
          --smoke "$RUNNER_TEMP/dialer-smoke.json"
          --build-marker packages/lead-connector/dist/embed-app/build-marker.json
          --output "$RUNNER_TEMP/dialer-release-manifest.json"

      - name: Upload dialer release manifest
        uses: actions/upload-artifact@v4
        with:
          name: dialer-release-${{ github.sha }}
          path: ${{ runner.temp }}/dialer-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish dialer release summary
        run: |
          echo "### Consuelo Dialer production release" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Git SHA: `\(.gitSha)`\n- Railway deployment: `\(.railway.deploymentId)` (`\(.railway.status)`)\n- Cloudflare version: `\(.cloudflare.versionId)`\n- Marketplace bootstrap SHA-256: `\(.launcherBootstrap.sha256)` (one-time install)\n- Safe smoke: `\(.smoke.ok)`"' "$RUNNER_TEMP/dialer-release-manifest.json" >> "$GITHUB_STEP_SUMMARY"

  # A strictly scoped LeadConnector presentation change must not restart
  # Railway, mutate provider secrets or replace existing call sessions.
  release-dialer-ui:
    name: Consuelo / LeadConnector UI-only release
    needs: dialer-changes
    if: needs.dialer-changes.outputs.frontend_only == 'true'
    environment: consuelo dialer / production
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact UI release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Build and test only LeadConnector UI
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bun test packages/lead-connector/src
          bun run --cwd packages/lead-connector typecheck
          bun run --cwd packages/lead-connector build

      - name: Validate Cloudflare-only release configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
          LEADCONNECTOR_PRODUCTION_EMBED_URL: ${{ vars.LEADCONNECTOR_PRODUCTION_EMBED_URL }}
          LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256: ${{ vars.LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256 }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN LEADCONNECTOR_PRODUCTION_EMBED_URL LEADCONNECTOR_MARKETPLACE_BOOTSTRAP_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing LeadConnector UI release setting: $name"
              exit 1
            fi
          done
          bun packages/lead-connector/scripts/verify-marketplace-bootstrap.ts packages/lead-connector/dist/embed-app/consuelo-lead-connector-click-to-call.marketplace-loader.html > "$RUNNER_TEMP/marketplace-bootstrap.json"

      - name: Upload LeadConnector Worker version without changing routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler versions upload \
            --config packages/lead-connector/wrangler.jsonc \
            --keep-vars \
            --tag "ui-$GITHUB_SHA" \
            --message "DEV-1676 UI source $GITHUB_SHA"

      - name: Deploy uploaded Worker version on existing routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler versions deploy \
            --config packages/lead-connector/wrangler.jsonc \
            --version-tag "ui-$GITHUB_SHA" \
            --message "DEV-1676 UI source $GITHUB_SHA" \
            --yes

      - name: Capture and verify exact deployed Worker version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DIALER_WORKER_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler deployments list \
            --config packages/lead-connector/wrangler.jsonc \
            --json > "$RUNNER_TEMP/worker-deployments.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .[-1] |
            ((.annotations["workers/message"] // "") | contains($sha)) and
            ((.versions | length) == 1) and
            (.versions[0].percentage == 100) and
            ((.versions[0].version_id | type) == "string")
          ' "$RUNNER_TEMP/worker-deployments.json" > /dev/null
          version_id="$(jq -er '.[-1].versions[0].version_id' "$RUNNER_TEMP/worker-deployments.json")"
          jq -n \
            --arg workerName "consuelo-lead-connector-embed" \
            --arg versionId "$version_id" \
            '{workerName: $workerName, versionId: $versionId, targets: ["https://calls.consuelohq.com"]}' \
            > "$RUNNER_TEMP/cloudflare-ui-deployment.json"

      - name: Verify deployed shell, launcher and compiled UI bytes
        env:
          LEADCONNECTOR_PRODUCTION_EMBED_URL: ${{ vars.LEADCONNECTOR_PRODUCTION_EMBED_URL }}
        run: |
          set -euo pipefail
          bun packages/lead-connector/scripts/verify-production-edge.ts > "$RUNNER_TEMP/leadconnector-ui-edge.json"
          base="${LEADCONNECTOR_PRODUCTION_EMBED_URL%/}"
          for asset in main.js main.css; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors "$base/$asset?v=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-$asset"
            if ! cmp -s "packages/lead-connector/dist/embed-app/$asset" "$RUNNER_TEMP/deployed-$asset"; then
              echo "::error::Deployed $asset does not match exact source build"
              exit 1
            fi
          done

      - name: Save UI-only release evidence
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg mainJsSha256 "$(sha256sum packages/lead-connector/dist/embed-app/main.js | cut -d' ' -f1)" \
            --arg mainCssSha256 "$(sha256sum packages/lead-connector/dist/embed-app/main.css | cut -d' ' -f1)" \
            --slurpfile worker "$RUNNER_TEMP/cloudflare-ui-deployment.json" \
            --slurpfile edge "$RUNNER_TEMP/leadconnector-ui-edge.json" \
            --slurpfile marketplace "$RUNNER_TEMP/marketplace-bootstrap.json" \
            '{ sourceSha: $sourceSha, railway: "unchanged", worker: $worker[0], edge: $edge[0], mainJsSha256: $mainJsSha256, mainCssSha256: $mainCssSha256, marketplaceBootstrap: $marketplace[0] }' \
            > "$RUNNER_TEMP/dialer-ui-release.json"

      - name: Upload UI release evidence
        uses: actions/upload-artifact@v4
        with:
          name: dialer-ui-release-${{ github.sha }}
          path: ${{ runner.temp }}/dialer-ui-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish UI release summary
        run: |
          echo "### Consuelo LeadConnector UI-only release" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Source: \(.sourceSha)\n- Cloudflare version: \(.worker.versionId)\n- Railway: unchanged\n- Main JavaScript SHA-256: \(.mainJsSha256)\n- Main CSS SHA-256: \(.mainCssSha256)\n- Safe edge verification: \(.edge.ok)"' "$RUNNER_TEMP/dialer-ui-release.json" >> "$GITHUB_STEP_SUMMARY"
