name: Consuelo Website

permissions:
  contents: read
  pull-requests: read

on:
  merge_group:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        package.json
        bun.lock
        yarn.lock
        packages/consuelo-website/**
        .github/workflows/ci-website.yaml
        .github/workflows/changed-files.yaml

  website:
    name: Consuelo / website
    needs: changed-files-check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: No website changes
        if: needs.changed-files-check.outputs.any_changed != 'true'
        run: echo "No Consuelo website changes detected."

      - uses: actions/checkout@v4
        if: needs.changed-files-check.outputs.any_changed == 'true'
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        if: needs.changed-files-check.outputs.any_changed == 'true'

      - name: Install website dependencies
        if: needs.changed-files-check.outputs.any_changed == 'true'
        working-directory: packages/consuelo-website
        run: bun install --frozen-lockfile

      - name: Build Consuelo website
        if: needs.changed-files-check.outputs.any_changed == 'true'
        run: bun run --cwd packages/consuelo-website build

  ci-website-status-check:
    name: Consuelo / website status
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, website]
    steps:
      - name: Fail if website or change detection failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
