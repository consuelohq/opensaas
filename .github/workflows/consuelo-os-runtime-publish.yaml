name: Consuelo OS runtime publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/os/**'
      - 'packages/diff-cockpit/**'
      - '.github/workflows/consuelo-os-runtime-publish.yaml'
      - 'bun.lock'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: consuelo-os-release-state
  cancel-in-progress: false

env:
  RELEASE_STATE_PATH: .release/release-state.json

jobs:
  distribution-gate:
    name: Validate distribution matrix
    uses: ./.github/workflows/consuelo-os-distribution-environments.yaml
    permissions:
      contents: read

  windows-service-host:
    name: Build deterministic Windows service host
    needs: distribution-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build deterministic Windows service host
        shell: pwsh
        run: |
          msbuild packages/os/native/windows-service/Consuelo.Windows.Service.csproj /p:Configuration=Release /p:Platform=x64 /m
          $serviceHost = 'packages/os/native/windows-service/bin/Release/Consuelo.Windows.Service.exe'
          if (-not (Test-Path -LiteralPath $serviceHost -PathType Leaf)) {
            throw "Windows service build did not produce $serviceHost"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-service-host
          path: packages/os/native/windows-service/bin/Release/Consuelo.Windows.Service.exe
          if-no-files-found: error
          retention-days: 7

  macos-service-host:
    name: Build macOS service host (${{ matrix.architecture }})
    needs: distribution-gate
    environment: consuelo / production
    # Experimental until Apple Developer ID/notary credentials are provisioned.
    if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, Developer ID sign, and notarize macOS service host
        shell: bash
        env:
          CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64 }}
          CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          CONSUELO_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.CONSUELO_MACOS_NOTARY_KEY_P8_BASE64 }}
          CONSUELO_MACOS_NOTARY_KEY_ID: ${{ secrets.CONSUELO_MACOS_NOTARY_KEY_ID }}
          CONSUELO_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CONSUELO_MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in \
            CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64 \
            CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD \
            CONSUELO_MACOS_NOTARY_KEY_P8_BASE64 \
            CONSUELO_MACOS_NOTARY_KEY_ID \
            CONSUELO_MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required macOS release credential: ${required}" >&2
              exit 1
            fi
          done

          swift build \
            --package-path packages/os/native/macos \
            --configuration release \
            --product ConsueloServiceHost
          bin_dir="$(swift build --package-path packages/os/native/macos --configuration release --show-bin-path)"
          output_dir="packages/os/native/macos/bin/${{ matrix.architecture }}"
          mkdir -p "$output_dir"
          cp "$bin_dir/ConsueloServiceHost" "$output_dir/ConsueloServiceHost"
          chmod 755 "$output_dir/ConsueloServiceHost"
          host="$output_dir/ConsueloServiceHost"

          signing_dir="$RUNNER_TEMP/consuelo-macos-signing"
          keychain="$signing_dir/consuelo-signing.keychain-db"
          keychain_password="$(uuidgen)"
          mkdir -p "$signing_dir"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          printf '%s' "$CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$signing_dir/developer-id.p12"
          printf '%s' "$CONSUELO_MACOS_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$signing_dir/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/developer-id.p12" \
            -k "$keychain" \
            -P "$CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "Imported certificate did not expose a Developer ID Application identity." >&2
            exit 1
          fi
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain" \
            --sign "$identity" \
            "$host"
          codesign --verify --strict --verbose=2 "$host"

          notary_zip="$signing_dir/ConsueloServiceHost-${{ matrix.architecture }}.zip"
          ditto -c -k --keepParent "$host" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "$signing_dir/notary-key.p8" \
            --key-id "$CONSUELO_MACOS_NOTARY_KEY_ID" \
            --issuer "$CONSUELO_MACOS_NOTARY_ISSUER_ID" \
            --wait
          spctl --assess --type execute --verbose=4 "$host"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-service-host-${{ matrix.architecture }}
          path: packages/os/native/macos/bin/${{ matrix.architecture }}/ConsueloServiceHost
          if-no-files-found: error
          retention-days: 7

  plan:
    name: Plan dev publication
    needs:
      - distribution-gate
      - windows-service-host
      - macos-service-host
    if: >-
      always() &&
      needs.distribution-gate.result == 'success' &&
      needs.windows-service-host.result == 'success' &&
      (needs.macos-service-host.result == 'success' || needs.macos-service-host.result == 'skipped')
    runs-on: ubuntu-latest
    environment: consuelo / production
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      revision: ${{ steps.plan.outputs.revision }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: windows-service-host
          path: packages/os/native/windows-service/bin/Release
      - uses: actions/download-artifact@v4
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        with:
          name: macos-service-host-arm64
          path: packages/os/native/macos/bin/arm64
      - uses: actions/download-artifact@v4
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        with:
          name: macos-service-host-x64
          path: packages/os/native/macos/bin/x64
      - name: Install dependencies
        working-directory: packages/os
        run: bun install --frozen-lockfile
      - name: Install Wrangler
        run: bun install --global wrangler@4.105.0
      - name: Restore authoritative release state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CONSUELO_OS_RELEASE_R2_BUCKET: ${{ vars.CONSUELO_OS_RELEASE_R2_BUCKET }}
        shell: bash
        run: |
          mkdir -p .release
          set +e
          bunx wrangler r2 object get "${CONSUELO_OS_RELEASE_R2_BUCKET}/state/release-state.json" \
            --remote \
            --file "${RELEASE_STATE_PATH}" > .release/state-restore.log 2>&1
          restore_status=$?
          set -e
          if [[ ${restore_status} -ne 0 ]]; then
            if grep -Eqi 'not found|does not exist|10007' .release/state-restore.log; then
              echo "No authoritative release state exists yet."
              rm -f "${RELEASE_STATE_PATH}"
            else
              echo "Failed to restore authoritative release state." >&2
              exit "${restore_status}"
            fi
          fi
          rm -f .release/state-restore.log
      - name: Compute version-neutral runtime fingerprint
        id: fingerprint
        run: |
          bun run --cwd packages/os runtime-bundle:fingerprint -- \
            --source-root . \
            --vendored-source "scripts/server/vendor/diff-cockpit.ts=../diff-cockpit/src/index.ts" \
            > .release/fingerprint.json
          echo "value=$(jq -r '.releaseFingerprint' .release/fingerprint.json)" >> "$GITHUB_OUTPUT"
      - name: Allocate release version only when changed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INTENT: ${{ vars.CONSUELO_OS_RELEASE_INTENT || 'patch' }}
          SEED_VERSION: ${{ vars.CONSUELO_OS_FIRST_RELEASE_VERSION }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | select(.name | startswith("consuelo-os-v")) | .name' \
            > .release/immutable-tags.txt
          mapfile -t tags < .release/immutable-tags.txt
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--immutable-tag "$tag")
          done
          seed_args=()
          if [[ -n "${SEED_VERSION}" ]]; then
            seed_args+=(--seed-version "${SEED_VERSION}")
          fi
          plan_json="$(bun run --cwd packages/os release:channels -- publish \
            --channel dev \
            --plan-only \
            --state "../../${RELEASE_STATE_PATH}" \
            --fingerprint "${{ steps.fingerprint.outputs.value }}" \
            --source-commit "${GITHUB_SHA}" \
            --intent "${RELEASE_INTENT}" \
            "${seed_args[@]}" \
            "${tag_args[@]}" \
            --json)"
          echo "$plan_json" | jq .
          echo "changed=$(echo "$plan_json" | jq -r '.changed')" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(echo "$plan_json" | jq -r '.releaseFingerprint')" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r '.revision // 0' "${RELEASE_STATE_PATH}" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$plan_json" | jq -r '.version // empty')" >> "$GITHUB_OUTPUT"
      - name: Confirm changed runtime closure
        if: steps.plan.outputs.changed == 'true'
        run: echo "Runtime closure changed; build version ${{ steps.plan.outputs.version }}."
      - name: Record true no-op
        if: steps.plan.outputs.changed != 'true'
        run: echo "Runtime closure is unchanged. No version, build, tag, release, deployment, or channel mutation will occur."

  macos-menu-app:
    name: Package signed Consuelo.app (${{ matrix.architecture }})
    needs:
      - plan
      - macos-service-host
    environment: consuelo / production
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.changed == 'true' &&
      needs.macos-service-host.result == 'success' &&
      vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-service-host-${{ matrix.architecture }}
          path: packages/os/native/macos/bin/${{ matrix.architecture }}
      - name: Build, sign, notarize, and staple Consuelo.app
        shell: bash
        env:
          CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64 }}
          CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD }}
          CONSUELO_MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.CONSUELO_MACOS_NOTARY_KEY_P8_BASE64 }}
          CONSUELO_MACOS_NOTARY_KEY_ID: ${{ secrets.CONSUELO_MACOS_NOTARY_KEY_ID }}
          CONSUELO_MACOS_NOTARY_ISSUER_ID: ${{ secrets.CONSUELO_MACOS_NOTARY_ISSUER_ID }}
          CONSUELO_MAC_APP_VERSION: ${{ needs.plan.outputs.version }}
          CONSUELO_MAC_APP_BUILD_VERSION: ${{ needs.plan.outputs.version }}
          CONSUELO_MAC_APP_SERVICE_HOST: packages/os/native/macos/bin/${{ matrix.architecture }}/ConsueloServiceHost
          CONSUELO_MAC_APP_ADHOC_SIGN: '0'
        run: |
          set -euo pipefail
          for required in \
            CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64 \
            CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD \
            CONSUELO_MACOS_NOTARY_KEY_P8_BASE64 \
            CONSUELO_MACOS_NOTARY_KEY_ID \
            CONSUELO_MACOS_NOTARY_ISSUER_ID; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required macOS release credential: ${required}" >&2
              exit 1
            fi
          done

          package_dir="$RUNNER_TEMP/consuelo-macos-app-${{ matrix.architecture }}"
          bash packages/os/scripts/testing/macos-alpha-package.sh "$package_dir"
          app="$package_dir/Consuelo.app"
          helper="$app/Contents/Library/LaunchServices/ConsueloServiceHost"
          test -x "$app/Contents/MacOS/ConsueloMenuBarApp"
          test -x "$helper"

          signing_dir="$RUNNER_TEMP/consuelo-macos-app-signing"
          keychain="$signing_dir/consuelo-signing.keychain-db"
          keychain_password="$(uuidgen)"
          mkdir -p "$signing_dir"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          printf '%s' "$CONSUELO_MACOS_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$signing_dir/developer-id.p12"
          printf '%s' "$CONSUELO_MACOS_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$signing_dir/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/developer-id.p12" \
            -k "$keychain" \
            -P "$CONSUELO_MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "Imported certificate did not expose a Developer ID Application identity." >&2
            exit 1
          fi

          codesign --verify --strict --verbose=2 "$helper"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain" \
            --sign "$identity" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          notary_zip="$signing_dir/Consuelo.app-${{ matrix.architecture }}.zip"
          ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "$signing_dir/notary-key.p8" \
            --key-id "$CONSUELO_MACOS_NOTARY_KEY_ID" \
            --issuer "$CONSUELO_MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

          release_dir=".release/macos-menu-app"
          mkdir -p "$release_dir"
          archive="$release_dir/Consuelo.app-${{ matrix.architecture }}.tar.gz"
          tar -czf "$archive" -C "$package_dir" Consuelo.app
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-menu-app-${{ matrix.architecture }}
          path: .release/macos-menu-app/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.architecture }}
    needs:
      - plan
      - windows-service-host
      - macos-service-host
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.changed == 'true' &&
      needs.windows-service-host.result == 'success' &&
      (needs.macos-service-host.result == 'success' || needs.macos-service-host.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
            architecture: arm64
          - runner: macos-15-intel
            platform: darwin
            architecture: x64
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
          - runner: windows-latest
            platform: windows
            architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: windows-service-host
          path: packages/os/native/windows-service/bin/Release
      - uses: actions/download-artifact@v4
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        with:
          name: macos-service-host-arm64
          path: packages/os/native/macos/bin/arm64
      - uses: actions/download-artifact@v4
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        with:
          name: macos-service-host-x64
          path: packages/os/native/macos/bin/x64
      - name: Install dependencies
        working-directory: packages/os
        shell: bash
        run: bun install --frozen-lockfile
      - name: Build runtime bundle exactly once
        shell: bash
        env:
          OUTPUT_PATH: .release/consuelo-os-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
        run: |
          mkdir -p .release
          bun run --cwd packages/os runtime-bundle:build -- \
            --source-root . \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.architecture }}" \
            --version "${{ needs.plan.outputs.version }}" \
            --source-commit "${GITHUB_SHA}" \
            --minimum-updater-version "${{ vars.CONSUELO_OS_MINIMUM_UPDATER_VERSION || '0.1.0' }}" \
            --migration "2026-08-13-reconcile-caddy-worker-pool:scripts/migrations/reconcile-caddy-worker-pool.ts" \
            --migration "release-${{ needs.plan.outputs.version }}-reconcile-caddy-gateway:scripts/migrations/reconcile-caddy-worker-pool.ts" \
            --migration "2026-08-13-reconcile-caddy-ha-watchdog:scripts/migrations/reconcile-caddy-ha-watchdog.ts" \
            --vendored-source "scripts/server/vendor/diff-cockpit.ts=../diff-cockpit/src/index.ts" \
            --output "../../${OUTPUT_PATH}"
          bun run --cwd packages/os runtime-bundle:verify -- \
            --archive "../../${OUTPUT_PATH}"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-${{ matrix.architecture }}
          path: .release/consuelo-os-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable release and dev pointer
    needs:
      - distribution-gate
      - plan
      - build
      - macos-menu-app
    if: >-
      always() &&
      needs.distribution-gate.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.changed == 'true' &&
      needs.build.result == 'success' &&
      (needs.macos-menu-app.result == 'success' || needs.macos-menu-app.result == 'skipped')
    runs-on: ubuntu-latest
    environment: consuelo / production
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: packages/os
        run: bun install --frozen-lockfile
      - name: Install Wrangler
        run: bun install --global wrangler@4.105.0
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: .release/archives
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        with:
          pattern: macos-menu-app-*
          path: .release/macos-apps
          merge-multiple: true
      - name: Restore authoritative release state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CONSUELO_OS_RELEASE_R2_BUCKET: ${{ vars.CONSUELO_OS_RELEASE_R2_BUCKET }}
        shell: bash
        run: |
          set +e
          bunx wrangler r2 object get "${CONSUELO_OS_RELEASE_R2_BUCKET}/state/release-state.json" \
            --remote \
            --file "${RELEASE_STATE_PATH}" > .release/state-restore.log 2>&1
          restore_status=$?
          set -e
          if [[ ${restore_status} -ne 0 ]]; then
            if grep -Eqi 'not found|does not exist|10007' .release/state-restore.log; then
              echo "No authoritative release state exists yet."
              rm -f "${RELEASE_STATE_PATH}"
            else
              echo "Failed to restore authoritative release state." >&2
              exit "${restore_status}"
            fi
          fi
          rm -f .release/state-restore.log
      - name: Verify, sign, and assemble publication input
        id: publication
        env:
          CONSUELO_OS_RELEASE_SIGNING_KEY_ID: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_KEY_ID }}
          CONSUELO_OS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CONSUELO_OS_RELEASE_SIGNING_PRIVATE_KEY }}
          CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          result="$(bun ./packages/os/scripts/prepare-release-publication.ts \
            --archive "darwin-arm64=.release/archives/consuelo-os-darwin-arm64.tar.gz" \
            --archive "darwin-x64=.release/archives/consuelo-os-darwin-x64.tar.gz" \
            --archive "linux-x64=.release/archives/consuelo-os-linux-x64.tar.gz" \
            --archive "windows-x64=.release/archives/consuelo-os-windows-x64.tar.gz" \
            --version "${{ needs.plan.outputs.version }}" \
            --fingerprint "${{ needs.plan.outputs.fingerprint }}" \
            --source-commit "${GITHUB_SHA}" \
            --evidence "ci=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --evidence "tests=consuelo-os-distribution-environments" \
            --signature-directory .release/signatures \
            --output .release/publication.json)"
          echo "$result" | jq .
          echo "bundle=$(echo "$result" | jq -r '.bundleId')" >> "$GITHUB_OUTPUT"
      - name: Publish immutable signed macOS app artifacts
        if: vars.CONSUELO_MACOS_SERVICE_HOST_RELEASE_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CONSUELO_OS_RELEASE_R2_BUCKET: ${{ vars.CONSUELO_OS_RELEASE_R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for architecture in arm64 x64; do
            source=".release/macos-apps/Consuelo.app-${architecture}.tar.gz"
            test -f "$source"
            key="apps/macos/${{ needs.plan.outputs.version }}/${architecture}/Consuelo.app.tar.gz"
            existing="$RUNNER_TEMP/consuelo-existing-${architecture}.tar.gz"
            lookup_log="$RUNNER_TEMP/consuelo-existing-${architecture}.log"

            set +e
            bunx wrangler r2 object get "${CONSUELO_OS_RELEASE_R2_BUCKET}/${key}" \
              --remote \
              --file "$existing" >"$lookup_log" 2>&1
            lookup_status=$?
            set -e

            if [[ "$lookup_status" -eq 0 ]]; then
              echo "Immutable macOS app artifact already exists at ${key}; preserving existing bytes."
              rm -f "$existing" "$lookup_log"
              continue
            fi
            if ! grep -Eqi 'not found|does not exist|10007' "$lookup_log"; then
              cat "$lookup_log" >&2
              exit "$lookup_status"
            fi
            rm -f "$existing" "$lookup_log"
            bunx wrangler r2 object put "${CONSUELO_OS_RELEASE_R2_BUCKET}/${key}" \
              --remote \
              --file "$source"
          done
      - name: Publish immutable bytes and signed dev manifest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_OS_RELEASE_API_TOKEN: ${{ secrets.CLOUDFLARE_OS_RELEASE_API_TOKEN }}
          CONSUELO_OS_RELEASE_R2_BUCKET: ${{ vars.CONSUELO_OS_RELEASE_R2_BUCKET }}
          CONSUELO_OS_RELEASE_SIGNING_KEY_ID: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_KEY_ID }}
          CONSUELO_OS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.CONSUELO_OS_RELEASE_SIGNING_PRIVATE_KEY }}
          CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.CONSUELO_OS_RELEASE_SIGNING_PUBLIC_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_time="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags?per_page=100" \
            --jq '.[] | select(.name | startswith("consuelo-os-v")) | .name' \
            > .release/immutable-tags.txt
          mapfile -t tags < .release/immutable-tags.txt
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--immutable-tag "$tag")
          done
          bun run --cwd packages/os release:channels -- publish \
            --channel dev \
            --bundle "${{ steps.publication.outputs.bundle }}" \
            --input ../../.release/publication.json \
            --state "../../${RELEASE_STATE_PATH}" \
            --expected-revision "${{ needs.plan.outputs.revision }}" \
            --now "${release_time}" \
            "${tag_args[@]}" \
            --apply \
            --json
