name: Consuelo CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref for manual verification
        required: false
        default: origin/main
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  consuelo-changes:
    name: Consuelo / changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_ref: ${{ steps.classify.outputs.base_ref }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      verify: ${{ steps.classify.outputs.verify }}
      workflow_security: ${{ steps.classify.outputs.workflow_security }}
      os_contracts: ${{ steps.classify.outputs.os_contracts }}
      dialer: ${{ steps.classify.outputs.dialer }}
      sites_gateway_cloudflare: ${{ steps.classify.outputs.sites_gateway_cloudflare }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Consuelo CI planner
        uses: ./.github/actions/consuelo-ci-setup
        with:
          setup-node: 'false'
          install-root: 'false'
          install-os: 'false'

      - name: Classify Consuelo changes
        id: classify
        env:
          CONSUELO_CI_MANUAL_BASE: ${{ github.event.inputs.base || 'origin/main' }}
        run: bun packages/os/scripts/ci-plan.ts

  workflow-security:
    name: Consuelo / workflow security
    needs: consuelo-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: No workflow changes
        if: needs.consuelo-changes.outputs.workflow_security != 'true'
        run: echo "No GitHub workflow or local action changes detected."

      - uses: actions/checkout@v4
        if: needs.consuelo-changes.outputs.workflow_security == 'true'
        with:
          ref: ${{ needs.consuelo-changes.outputs.head_sha }}
          fetch-depth: 0

      - name: Review changed GitHub automation
        if: needs.consuelo-changes.outputs.workflow_security == 'true'
        run: node packages/workspace/scripts/ci/check-github-workflows.cjs "${{ needs.consuelo-changes.outputs.base_ref }}"

  verify:
    name: Consuelo / verify
    needs: consuelo-changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: No Consuelo verification changes
        if: needs.consuelo-changes.outputs.verify != 'true'
        run: echo "No Consuelo-owned or cross-cutting changes detected."

      - uses: actions/checkout@v4
        if: needs.consuelo-changes.outputs.verify == 'true'
        with:
          ref: ${{ needs.consuelo-changes.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Consuelo verification
        if: needs.consuelo-changes.outputs.verify == 'true'
        uses: ./.github/actions/consuelo-ci-setup
        with:
          install-root: 'true'
          install-os: ${{ needs.consuelo-changes.outputs.os_contracts }}

      - name: Run workspace verify
        if: needs.consuelo-changes.outputs.verify == 'true'
        run: bun run verify -- --base "${{ needs.consuelo-changes.outputs.base_ref }}" --committed-only-tests --no-stamp --review-arg --no-tests

  os-contracts:
    name: Consuelo / OS contracts
    needs: consuelo-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: No OS contract changes
        if: needs.consuelo-changes.outputs.os_contracts != 'true'
        run: echo "No OS contract changes detected."

      - uses: actions/checkout@v4
        if: needs.consuelo-changes.outputs.os_contracts == 'true'
        with:
          ref: ${{ needs.consuelo-changes.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup OS contract tests
        if: needs.consuelo-changes.outputs.os_contracts == 'true'
        uses: ./.github/actions/consuelo-ci-setup
        with:
          install-root: 'false'
          install-os: 'true'

      - name: Run OS contract tests
        if: needs.consuelo-changes.outputs.os_contracts == 'true'
        working-directory: packages/os
        run: |
          bun x vitest run \
            tests/tool-manifest.test.ts \
            tests/security-gateway.test.ts \
            tests/workspace-gateway-contract.test.ts

  dialer:
    name: Consuelo / dialer
    needs: consuelo-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: No dialer changes
        if: needs.consuelo-changes.outputs.dialer != 'true'
        run: echo "No dialer changes detected."

      - uses: actions/checkout@v4
        if: needs.consuelo-changes.outputs.dialer == 'true'
        with:
          ref: ${{ needs.consuelo-changes.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup dialer CI
        if: needs.consuelo-changes.outputs.dialer == 'true'
        uses: ./.github/actions/consuelo-ci-setup

      - name: Run dialer release package tests
        if: needs.consuelo-changes.outputs.dialer == 'true'
        run: |
          bun test packages/dialer/src
          bun test packages/dialer-server/src
          bun test packages/lead-connector/src

      - name: Build dialer typecheck prerequisites
        if: needs.consuelo-changes.outputs.dialer == 'true'
        run: bun run --cwd packages/logger build

      - name: Typecheck dialer release packages
        if: needs.consuelo-changes.outputs.dialer == 'true'
        run: |
          bun run --cwd packages/dialer typecheck
          bun run --cwd packages/dialer-server typecheck
          bun run --cwd packages/lead-connector typecheck

      - name: Build dialer release artifacts
        if: needs.consuelo-changes.outputs.dialer == 'true'
        run: |
          bun run --cwd packages/dialer build
          bun run --cwd packages/lead-connector build
          bun run --cwd packages/dialer-server build

      - name: Build Railway dialer container
        if: needs.consuelo-changes.outputs.dialer == 'true'
        run: >-
          docker build
          --file packages/dialer-server/Dockerfile
          --tag consuelo-dialer-ci:${{ github.sha }}
          .

  sites-gateway-cloudflare:
    name: Consuelo / Sites Gateway + Cloudflare
    needs: consuelo-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: No Sites Gateway or Cloudflare changes
        if: needs.consuelo-changes.outputs.sites_gateway_cloudflare != 'true'
        run: echo "No Sites Gateway or Cloudflare changes detected."

      - uses: actions/checkout@v4
        if: needs.consuelo-changes.outputs.sites_gateway_cloudflare == 'true'
        with:
          ref: ${{ needs.consuelo-changes.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Sites Gateway tests
        if: needs.consuelo-changes.outputs.sites_gateway_cloudflare == 'true'
        uses: ./.github/actions/consuelo-ci-setup
        with:
          install-root: 'false'
          install-os: 'true'

      - name: Run Sites Gateway and Cloudflare tests
        if: needs.consuelo-changes.outputs.sites_gateway_cloudflare == 'true'
        working-directory: packages/os
        run: |
          bun x vitest run \
            tests/consuelo-sites-gateway.test.ts \
            tests/consuelo-sites-gateway-policy.test.ts \
            tests/cloudflare-worker-deployment-contract.test.ts
