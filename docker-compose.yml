name: consuelo

services:
  db:
    image: postgres:16
    ports:
      - '${PG_DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-consuelo}
      POSTGRES_USER: ${PG_DATABASE_USER:-consuelo}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-consuelo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PG_DATABASE_USER:-consuelo} -d ${PG_DATABASE_NAME:-consuelo}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
